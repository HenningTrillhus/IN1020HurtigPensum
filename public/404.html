<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <title>Siden finnes ikke · IN1020 Hurtigpensum</title>
    <style>
      html, body { margin: 0; background: #000; color: #fff; }
      body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font: 500 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
      main { text-align: center; max-width: 360px; animation: in .4s ease both }
      .code { margin: 0; font-size: clamp(84px, 30vw, 140px); font-weight: 800; line-height: 1; letter-spacing: -.04em; color: transparent; background: linear-gradient(135deg, #fff, #7a7a7a); -webkit-background-clip: text; background-clip: text }
      h1 { margin: 6px 0 8px; font-size: 24px }
      p { margin: 0 0 22px; color: #a3a3a3 }
      .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap }
      a { display: inline-flex; align-items: center; min-height: 46px; padding: 0 22px; border-radius: 99px; font-weight: 600; text-decoration: none; transition: transform .15s ease }
      a:active { transform: scale(.97) }
      .main { background: #fff; color: #000 }
      .alt { background: #141414; color: #fff; border: 1px solid #333 }
      @keyframes in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      @media (prefers-reduced-motion: reduce) { main { animation: none } }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Her var det tomt</h1>
      <p>Siden du lette etter finnes ikke, eller lenken er gammel.</p>
      <div class="actions">
        <a class="main" href="/">Til forsiden</a>
        <a class="alt" href="/#/shuffle">Bland videoer</a>
      </div>
    </main>
  </body>
</html>
