<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <script>
      (function () {
        var t = 'dark';
        try { if (localStorage.getItem('theme') === 'light') t = 'light'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <title>IN1020 Hurtigpensum</title>
    <meta name="description" content="IN1020 ett minutt av gangen. Sveip gjennom korte, AI-genererte videoer for hvert delkapittel og slå opp fagbegreper." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="IN1020 Hurtigpensum" />
    <meta property="og:description" content="Pensum i korte klipp. Sveip gjennom videoer for hvert delkapittel i IN1020." />
    <meta property="og:image" content="https://in1020-hurtig-pensum.vercel.app/icon-512.png?v=2" />
    <meta name="twitter:card" content="summary" />
    <style>
      /* Lasteskjerm: ligger her så den vises umiddelbart, før resten av siden er lastet. */
      html, body { margin: 0; background: #000000; }
      .loader { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #a3a3a3; font: 500 15px system-ui, sans-serif; animation: loaderIn .3s ease both }
      .loader-spinner { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #2b2b2b; border-top-color: #ffffff; animation: loaderSpin .8s linear infinite }
      .loader-text { margin: 0 }
      .loader.error { text-align: center; padding: 24px }
      .loader.error button { font: inherit; color: #000000; background: #ffffff; border: 0; border-radius: 99px; padding: 12px 24px; font-weight: 600; cursor: pointer }
      html[data-theme="light"], html[data-theme="light"] body { background: #ffffff; }
      html[data-theme="light"] .loader { color: #5a7289; }
      html[data-theme="light"] .loader-spinner { border-color: #d2e4f5; border-top-color: #5db4f7; }
      html[data-theme="light"] .loader.error button { color: #06263f; background: #8cc9ff; }
      @keyframes loaderIn { from { opacity: 0 } to { opacity: 1 } }
      @keyframes loaderSpin { to { transform: rotate(360deg) } }
      @media (prefers-reduced-motion: reduce) { .loader-spinner { animation-duration: 2.4s } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loader" role="status" aria-live="polite">
        <div class="loader-spinner"></div>
        <p class="loader-text">Laster</p>
      </div>
    </div>
    <noscript><p style="color:#eee;font-family:system-ui;padding:24px">Siden trenger JavaScript for å vise videoene.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
