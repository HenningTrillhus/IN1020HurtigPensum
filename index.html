<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07090f" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>IN1020 Hurtigpensum</title>
    <meta name="description" content="IN1020 ett minutt av gangen. Sveip gjennom korte, AI-genererte videoer for hvert delkapittel og test deg selv med quiz." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="IN1020 Hurtigpensum" />
    <meta property="og:description" content="Pensum i korte klipp. Sveip gjennom videoer for hvert delkapittel i IN1020." />
    <meta property="og:image" content="https://in1020-hurtigpensum.vercel.app/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <style>
      /* Lasteskjerm: ligger her så den vises umiddelbart, før resten av siden er lastet. */
      html, body { margin: 0; background: #07090f; }
      .loader { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; color: #8d96ad; font: 500 15px system-ui, sans-serif; animation: loaderIn .4s ease both }
      .loader-logo { position: relative; width: 104px; height: 104px; display: grid; place-items: center }
      .loader-logo img { width: 74px; height: 74px; border-radius: 18px; animation: loaderPulse 1.8s ease-in-out infinite }
      .loader-ring { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, #60a5fa00, #60a5fa, #34d399);
        -webkit-mask: radial-gradient(farthest-side, #0000 calc(100% - 3px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, #0000 calc(100% - 3px), #000 calc(100% - 2px));
        animation: loaderSpin 1.1s linear infinite }
      .loader-text { margin: 0 }
      .dots i { font-style: normal; animation: loaderDot 1.2s infinite both }
      .dots i:nth-child(2) { animation-delay: .15s } .dots i:nth-child(3) { animation-delay: .3s }
      .loader-bar { width: 168px; height: 3px; border-radius: 3px; background: #1a2133; overflow: hidden }
      .loader-bar span { display: block; height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #60a5fa, #34d399); animation: loaderSlide 1.3s ease-in-out infinite }
      .loader.error { text-align: center; padding: 24px }
      .loader.error button { font: inherit; color: #05101a; background: linear-gradient(135deg, #60a5fa, #34d399); border: 0; border-radius: 99px; padding: 12px 22px; font-weight: 700; cursor: pointer }
      @keyframes loaderIn { from { opacity: 0 } to { opacity: 1 } }
      @keyframes loaderSpin { to { transform: rotate(360deg) } }
      @keyframes loaderPulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 24px #3b82f633 } 50% { transform: scale(1.07); box-shadow: 0 0 44px #3b82f688 } }
      @keyframes loaderDot { 0%, 80%, 100% { opacity: .2 } 40% { opacity: 1 } }
      @keyframes loaderSlide { 0% { transform: translateX(-110%) } 100% { transform: translateX(270%) } }
      @media (prefers-reduced-motion: reduce) { .loader-ring, .loader-logo img, .loader-bar span, .dots i { animation: none } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loader" role="status" aria-live="polite">
        <div class="loader-logo"><span class="loader-ring"></span><img src="/favicon-192.png" alt="" /></div>
        <p class="loader-text">Laster pensum<span class="dots"><i>.</i><i>.</i><i>.</i></span></p>
        <div class="loader-bar"><span></span></div>
      </div>
    </div>
    <noscript><p style="color:#eee;font-family:system-ui;padding:24px">Siden trenger JavaScript for å vise videoene.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
